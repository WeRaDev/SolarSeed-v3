name: ci
on:
  push:
    branches: [main, master, develop]
  pull_request:
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          github-server-url: http://host.docker.internal:3000
      - name: Validate baseline files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          if [ ! -f WARP.md ] && [ ! -f warp.md ]; then
            echo "WARP.md missing"
            exit 1
          fi
      - name: Quick repository sanity
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            python3 - <<'PY'
import py_compile
from pathlib import Path
failed=False
skip_parts={'.git','upstream','.venv','venv','__pycache__','node_modules'}
for p in Path('.').rglob('*.py'):
    if any(part in skip_parts for part in p.parts):
        continue
    try:
        py_compile.compile(str(p), doraise=True)
    except Exception as e:
        failed=True
        print(p, e)
if failed:
    raise SystemExit(1)
PY
          fi
